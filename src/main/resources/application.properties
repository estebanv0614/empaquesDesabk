spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/empaquesdesa}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
server.servlet.context-path=/empaques-desa/api

logging.level.org.springframework.security.web.*=warn

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notificacion.email-admin=${ADMIN_EMAIL:empaquesdesa@gmail.com}

app.upload.base=${UPLOAD_BASE:uploads}
app.upload.dir=${UPLOAD_DIR:uploads/bolsas}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

produccion.estado-pendiente=${ESTADO_PENDIENTE:3}
produccion.estado-en-produccion=${ESTADO_EN_PRODUCCION:7}

app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
app.jwt.secret=${JWT_SECRET:cambia-esto-solo-para-desarrollo-local-0123456789}
cloudinary.url=${CLOUDINARY_URL:}

spring.datasource.hikari.maximum-pool-size=${DB_POOL:3}